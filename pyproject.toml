[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosar-code-generator"
version = "0.1.0"
description = "Generic AUTOSAR ARXML Parser and C/C++ Code Generator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

authors = [
    { name = "Jayapandiyan" }
]

keywords = [
    "AUTOSAR",
    "ARXML",
    "CAN",
    "CANFD",
    "FlexRay",
    "Ethernet",
    "Code Generator",
    "Parser"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
]

dependencies = [
    "lxml>=5.0.0"
    "jinja2>=3.1.4",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "black>=24.4.2",
    "ruff>=0.5.0",
    "mypy>=1.10.1",
]

[project.scripts]

autosar-codegen = "autosar_codegen.cli.main:app"

[tool.black]

line-length = 100

target-version = ["py312"]

[tool.ruff]

line-length = 100

target-version = "py312"

[tool.pytest.ini_options]

testpaths = ["tests"]

pythonpath = [
    "src"
]

[tool.setuptools]

package-dir = {"" = "src"}

[tool.setuptools.packages.find]

where = ["src"]