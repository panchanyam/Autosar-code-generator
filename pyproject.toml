[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]

build-backend = "setuptools.build_meta"



# ============================================================================
# Project Metadata
# ============================================================================

[project]

name = "autosar-codegen"

version = "1.0.0"

description = "AUTOSAR XML based code generation framework"

readme = "README.md"

requires-python = ">=3.11"


authors = [
    {
        name = "AUTOSAR CodeGen Team"
    }
]


license = {
    text = "MIT"
}


keywords = [
    "AUTOSAR",
    "ARXML",
    "code-generation",
    "embedded",
    "automotive"
]



# ============================================================================
# Runtime Dependencies
# ============================================================================

dependencies = [

    "lxml>=5.0.0",

    "Jinja2>=3.1.0",

    "pydantic>=2.0.0",

]



# ============================================================================
# Optional Dependencies
# ============================================================================

[project.optional-dependencies]


dev = [

    "pytest>=8.0",

    "pytest-cov",

    "black",

    "ruff",

    "mypy",

]



# ============================================================================
# CLI Entry Point
# ============================================================================

[project.scripts]


autosar-codegen = (
    "autosar_codegen.cli.main:main"
)



# ============================================================================
# Package Discovery
# ============================================================================

[tool.setuptools.packages.find]

where = [
    "src"
]



# ============================================================================
# Development Tools
# ============================================================================


[tool.black]

line-length = 88

target-version = [
    "py311"
]



[tool.ruff]

line-length = 88

target-version = "py311"



[tool.mypy]

python_version = "3.11"

check_untyped_defs = true

disallow_untyped_defs = false